# Refreshes the /contributors page's list (packages/contributors, README
# there) every week, and opens or updates a pull request when someone new
# has contributed or a count has changed.
#
# The list is read with the workflow's own token: the GitHub App's has no
# issues permission, and without it GitHub's issues endpoint quietly
# returns only pull requests (the first run lost every issue that way).
# The pull request is opened with the App token (APP_ID / APP_PRIVATE_KEY,
# as in release-packages.yml) so that CI runs on it: pull requests opened
# with the default GITHUB_TOKEN don't trigger workflows.
name: Contributors

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @repo/contributors...

      - name: Collect
        run: pnpm --filter @repo/contributors collect
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          file=packages/contributors/src/data/contributors.json
          # A new date alone isn't worth a pull request.
          if git show "HEAD:$file" | jq -S '.people' | cmp -s - <(jq -S '.people' "$file"); then
            echo "No new contributions"
            exit 0
          fi
          # Credits are only ever added: a shorter list means a source failed.
          credits() { jq '[.people[].credits[].count] | add'; }
          before=$(git show "HEAD:$file" | credits)
          after=$(credits < "$file")
          if [ "$after" -lt $((before * 95 / 100)) ]; then
            echo "::error::Credits fell from $before to $after: a source failed, so nothing was opened."
            exit 1
          fi
          branch=chore/contributors-refresh
          git config user.name 'jsonresume-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add "$file"
          git commit -m 'chore(contributors): refresh the contributors list'
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --title 'chore(contributors): refresh the contributors list' \
              --body 'The weekly refresh of jsonresume.org/contributors (`.github/workflows/contributors.yml`): new contributors and updated counts from GitHub and npm.'
          fi
