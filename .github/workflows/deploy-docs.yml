name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - 'apps/docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-again.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter docs build

      # No CNAME: docs are served from the GitHub Pages project URL
      # (jsonresume.github.io/jsonresume.org), proxied at jsonresume.org/docs
      # by the box's Caddy.

      - name: Disable Jekyll
        run: touch apps/docs/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out

      # deploy-pages sometimes finds no artifact seconds after it was
      # uploaded (3 of 5 runs failed so on 2026-11-23..24, upload fine):
      # GitHub's artifact list lags. Try once more after a pause.
      - name: Deploy
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait for the artifact to be listed
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - name: Deploy (again)
        id: deploy-again
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
